name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests (label rules and sensor features; the EXIST data itself is not redistributed)
        run: pytest -q tests
      - name: Validate the 10 test-set runs (format, ids, labels)
        run: python src/validate_runs.py
